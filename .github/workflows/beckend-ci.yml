name: Backend CI Pipeline

on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  IMAGE_NAME: dolevatik/hotel-backend

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Installation
        run: |
          python --version
          pip --version

      - name: Smoke Test (import app)
        run: python -c "from app import app; print('App imported successfully')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-infra:
    name: Update Infra Manifests
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hotel-infra
        uses: actions/checkout@v4
        with:
          repository: DolevAtik/hotel-infra
          token: ${{ secrets.PAT }}
          path: infra

      - name: Update Backend Image
        run: |
          cd infra
          sed -i "s|image:.*backend.*|image: dolevatik/hotel-backend:${{ github.sha }}|g" kubernetes/backend/deployment.yaml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          path: infra
          branch: backend-${{ github.sha }}
          base: main
          commit-message: "Update backend image to ${{ github.sha }}"
          title: "Update backend image to ${{ github.sha }}"
          body: |
            Automated update from Backend CI
          delete-branch: true
