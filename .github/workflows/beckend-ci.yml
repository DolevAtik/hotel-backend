name: Backend CI Pipeline

on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  IMAGE_NAME: dolevatik/hotel-backend

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Installation
        run: |
          python --version
          pip --version

      - name: Smoke Test (import app)
        run: python -c "from app import app; print('App imported successfully')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-infra:
    name: Update Infra Manifests
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hotel-infra
        uses: actions/checkout@v4
        with:
          repository: DolevAtik/hotel-infra
          ref: main
          token: ${{ secrets.PAT }}
          path: infra

      - name: Update Backend Image
        run: |
          cd infra
          sed -i "s|image: dolevatik/hotel-backend:.*|image: dolevatik/hotel-backend:${{ github.sha }}|g" k8s/backend/deployment.yaml

      # Push straight to main so ArgoCD (which tracks main) picks the bump up
      # on its next sync. No PR, no manual merge step.
      - name: Commit and Push to main
        working-directory: infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Manifest already pinned to ${{ github.sha }} - nothing to push."
            exit 0
          fi

          git commit -am "Update backend image to ${{ github.sha }}"

          # Retry in case the frontend pipeline pushed to main in the meantime.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed backend image bump to main."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto latest main."
            git pull --rebase origin main
          done

          echo "Failed to push to main after 3 attempts."
          exit 1
